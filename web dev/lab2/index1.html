<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab2</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        h2 {
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-top: 20px;
        }

        /* Common box style */
        .box {
            width: 250px;
            height: 120px;
            padding: 20px;
            margin: 20px;
            color: white;
            text-align: center;
        }

        /* Border-box example */
        .border-box {
            background-color: black;
            border: 5px solid orange;
            box-sizing: border-box;
        }

        /* Content-box example */
        .content-box {
            background-color: lightblue;
            color: black;
            border: 5px solid violet;
            box-sizing: content-box;
        }

        /* Different border styles */
        .dashed {
            border: 4px dashed red;
            background-color: #333;
        }

        .dotted {
            border: 4px dotted green;
            background-color: #555;
        }

        /* Border radius examples */
        .rounded {
            border: 4px solid blue;
            border-radius: 15px;
            background-color: #222;
        }

        .circle {
            border: 4px solid purple;
            border-radius: 50%;
            background-color: #444;
        }
    </style>
</head>

<body>

    <h2>CSS Box Model Demonstration</h2>

    <div class="container">

        <div class="box border-box">
            <b>Border-Box</b><br>
            width = 250px<br>
            padding included
        </div>

        <div class="box content-box">
            <b>Content-Box</b><br>
            width = 250px<br>
            padding NOT included
        </div>

        <div class="box dashed">
            <b>Dashed Border</b><br>
            margin + padding visible
        </div>

        <div class="box dotted">
            <b>Dotted Border</b><br>
            spacing effect
        </div>

        <div class="box rounded">
            <b>Rounded Corners</b><br>
            border-radius: 15px
        </div>

        <div class="box circle">
            <b>Circle Shape</b><br>
            border-radius: 50%
        </div>

    </div>

</body>
</html>
